services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: velora
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora_dev
    ports: ["5432:5432"]
    volumes: ["velora_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  velora_pg:
